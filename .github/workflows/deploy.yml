name: Deploy to Hostinger

# Builds the app and syncs dist/ to Hostinger over FTP whenever a push/merge lands on main.
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and deploy via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Diffs against the sync-state file it maintains on the server, so each run only uploads
      # changed files and removes files that no longer exist in dist/ — not a plain additive
      # upload. See the deploy report for the server-dir path caveat to confirm against the
      # actual Hostinger FTP account root.
      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /kms/
